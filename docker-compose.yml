services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env, e.g. ghcr.io/<owner>/gptc:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://gptc:${POSTGRES_PASSWORD}@db:5432/gptc
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.gptc.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`) || Host(`www.${APP_DOMAIN}`)
      - traefik.http.routers.gptc.entrypoints=websecure
      - traefik.http.routers.gptc.tls=true
      - traefik.http.routers.gptc.tls.certresolver=myresolver
      - traefik.http.services.gptc.loadbalancer.server.port=3000
      # www -> apex redirect
      - traefik.http.middlewares.gptc-www.redirectregex.regex=^https?://www\.${APP_DOMAIN}/(.*)
      - traefik.http.middlewares.gptc-www.redirectregex.replacement=https://${APP_DOMAIN}/$$1
      - traefik.http.middlewares.gptc-www.redirectregex.permanent=true
      - traefik.http.routers.gptc.middlewares=gptc-www

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 256mb
    environment:
      POSTGRES_USER: gptc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gptc
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gptc"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Automated, scheduled pg_dump with retention. Dumps land in ./backups on the
  # host (bind mount) so they survive the DB container/volume and are trivial to
  # rsync off-box. Restore: see docs/OPERATIONS.md.
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: gptc
      POSTGRES_USER: gptc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # override in .env if you want a different cadence/retention
      SCHEDULE: ${BACKUP_SCHEDULE:-@every 6h}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      POSTGRES_EXTRA_OPTS: "--clean --if-exists --no-owner --no-privileges"
    volumes:
      - ./backups:/backups
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:

networks:
  web:
    external: true
  internal:
